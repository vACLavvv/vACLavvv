w"/><path d="M235 185 C262 171,270 187,289 163 S324 153,352 161" fill="none" stroke="#FFC581" stroke-width="3" stroke-dasharray="6 6" class="dash-slow"/><circle cx="235" cy="185" r="5" fill="#FFC581" class="pulse"/><text x="40" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" font-weight="650" fill="#73E1BD" >OBSERVED</text><text x="275" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" font-weight="650" fill="#FFC581" >PREDICTED</text><text x="23" y="310" font-family="Inter, system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="750" fill="#FFC581" >90</text><text x="70" y="306" font-family="Inter, system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="520" fill="#91A3BB" >load-testing experiments</text><text x="23" y="332" font-family="Inter, system-ui, -apple-system, Arial, sans-serif" font-size="12" font-weight="510" fill="#E7F1FF" >Prometheus · Python · Kubernetes HPA</text></svg>