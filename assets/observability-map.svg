<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Observability stack</title><desc id="desc">Metrics collected by Prometheus, logs centralized with Loki, traces handled by Tempo, and dashboards in Grafana.</desc>
<defs><style>.box{fill:#0e2235;stroke:#2b4b64;stroke-width:1.5}.title{font:700 19px Arial,sans-serif;fill:#e2e8f0}.sub{font:13px Arial,sans-serif;fill:#94a3b8}.flow{fill:none;stroke:#38bdf8;stroke-width:2.2;stroke-dasharray:8 7;animation:dash 5s linear infinite}@keyframes dash{to{stroke-dashoffset:-60}}</style></defs>
<rect width="1200" height="300" rx="18" fill="#071426" stroke="#24445d"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="12" fill="#7dd3fc" letter-spacing="2">OBSERVABILITY / SIGNALS → VISUALIZATION</text>
<rect x="38" y="102" width="205" height="112" rx="12" class="box"/><text x="62" y="145" class="title">Applications</text><text x="62" y="174" class="sub">Metrics · Logs · Traces</text><path d="M243 158H315" class="flow"/>
<rect x="315" y="66" width="210" height="62" rx="10" class="box"/><text x="340" y="104" class="title">Prometheus</text><text x="458" y="104" class="sub">metrics</text><rect x="315" y="143" width="210" height="62" rx="10" class="box"/><text x="340" y="181" class="title">Loki</text><text x="405" y="181" class="sub">logs</text><rect x="315" y="220" width="210" height="62" rx="10" class="box"/><text x="340" y="258" class="title">Tempo</text><text x="415" y="258" class="sub">traces</text>
<path d="M525 97H650V158H748M525 174H748M525 251H650V190H748" class="flow"/><rect x="748" y="102" width="220" height="112" rx="12" fill="#102d2b" stroke="#34d399" stroke-width="1.5"/><text x="786" y="145" class="title">Grafana</text><text x="786" y="174" class="sub">Dashboards &amp; analysis</text><path d="M968 158H1050" class="flow"/><rect x="1050" y="122" width="112" height="72" rx="10" class="box"/><text x="1071" y="151" class="title" font-size="16">Insights</text><text x="1070" y="174" class="sub">Visibility</text></svg>
