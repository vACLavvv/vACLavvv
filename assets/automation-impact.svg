<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Infrastructure automation impact</title><desc id="desc">Resume metrics: 500 plus workstations in corporate infrastructure, 100 to 200 workstation rollout batches, 1C installation reduced from 30 minutes to 3 to 5 minutes, workstation preparation from 25 to 5 minutes.</desc>
<defs><style>.card{fill:#0d2032;stroke:#24445d;stroke-width:1.4}.k{font:12px Arial,sans-serif;fill:#7dd3fc;letter-spacing:1.5px}.v{font:700 32px Arial,sans-serif;fill:#f1f5f9}.d{font:13px Arial,sans-serif;fill:#94a3b8}.arrow{stroke:#34d399;stroke-width:2;stroke-dasharray:5 5;animation:move 5s linear infinite}@keyframes move{to{stroke-dashoffset:-40}}</style></defs>
<rect width="1200" height="320" rx="18" fill="#071426" stroke="#24445d"/><text x="30" y="38" class="k">AUTOMATION / MEASURED OUTCOMES</text>
<g><rect x="28" y="62" width="270" height="218" rx="13" class="card"/><text x="52" y="100" class="k">CORPORATE FLEET</text><text x="52" y="153" class="v">500+</text><text x="52" y="182" class="d">workstations in supported</text><text x="52" y="202" class="d">corporate infrastructure</text><path d="M52 235H260" class="arrow"/><text x="52" y="260" class="d">Ansible · RED OS · Linux</text>
<rect x="318" y="62" width="270" height="218" rx="13" class="card"/><text x="342" y="100" class="k">ROLLOUT BATCHES</text><text x="342" y="153" class="v">100–200</text><text x="342" y="182" class="d">workstations per software</text><text x="342" y="202" class="d">deployment group</text><path d="M342 235H550" class="arrow"/><text x="342" y="260" class="d">Ansible Playbooks</text>
<rect x="608" y="62" width="270" height="218" rx="13" class="card"/><text x="632" y="100" class="k">1C INSTALLATION</text><text x="632" y="153" class="v">30 → 3–5 min</text><text x="632" y="182" class="d">per workstation after</text><text x="632" y="202" class="d">automation</text><path d="M632 235H840" class="arrow"/><text x="632" y="260" class="d">Bash · Ansible · RED OS</text>
<rect x="898" y="62" width="274" height="218" rx="13" class="card"/><text x="922" y="100" class="k">WORKSTATION PREP</text><text x="922" y="153" class="v">25 → 5 min</text><text x="922" y="182" class="d">reduced preparation time</text><text x="922" y="202" class="d">through routine automation</text><path d="M922 235H1134" class="arrow"/><text x="922" y="260" class="d">Linux operations · Automation</text></g></svg>
