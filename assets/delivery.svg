<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="GitLab CI/CD deployment pipeline illustration">
  <title>GitLab CI/CD deployment pipeline illustration</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C2D"/><stop offset="1" stop-color="#0B101B"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#B4A1FF" stop-opacity=".16"/><stop offset="1" stop-color="#B4A1FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="25" height="25"><path d="M25 0H0V25" fill="none" stroke="#9CB0CB" stroke-opacity=".045" stroke-width="1"/></pattern>
    <filter id="shadow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <style>
    .blink { animation: blinking 1.15s steps(1, end) infinite; }
    .pulse { animation: pulse 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-2 { animation: pulse 2.9s ease-in-out -1.35s infinite; transform-box: fill-box; transform-origin: center; }
    .dash { stroke-dasharray: 7 8; animation: dash 2.2s linear infinite; }
    .dash-slow { stroke-dasharray: 4 9; animation: dash 4.5s linear infinite; }
    .scan { animation: scan 4s ease-in-out infinite; }
    .rise { animation: rise 5s ease-in-out infinite; }
    .barwave { animation: grow 3.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .barwave2 { animation: grow 3.8s ease-in-out -1.1s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .barwave3 { animation: grow 3.8s ease-in-out -2.1s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .reveal { animation: reveal 3.6s steps(22, end) infinite alternate; }
    .dashdraw { stroke-dasharray: 650; stroke-dashoffset: 650; animation: draw 5s ease-in-out infinite alternate; }
    .fade { animation: fade 4s ease-in-out infinite alternate; }
    @keyframes blinking { 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -60; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes scan { 0%, 100% { transform: translateX(0); opacity: .2; } 50% { transform: translateX(22px); opacity: .8; } }
    @keyframes grow { 0% { transform: scaleY(.65); } 100% { transform: scaleY(1); } }
    @keyframes reveal { 0% { width: 0px; } 55%, 100% { width: 360px; } }
    @keyframes draw { 0% { stroke-dashoffset: 650; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes fade { 0% {opacity: .3;} 100% {opacity: 1;} }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .reveal { width: 360px !important; }
      .dashdraw { stroke-dashoffset: 0 !important; }
    }
</style>
  <rect x="1" y="1" width="1198" height="114" rx="16" fill="url(#base)" stroke="#29374C" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="114" rx="16" fill="url(#grid)"/>
<text x="25" y="31" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="720" fill="#B4A1FF" >DELIVERY WORKFLOW</text><text x="1166" y="31" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="560" fill="#91A3BB" text-anchor="end">CI/CD • DEPLOYMENT</text><rect x="90" y="49" width="166" height="42" rx="10" fill="#19273A" stroke="#29374C"/><circle cx="107" cy="70" r="4" fill="#73E1BD" class="pulse-2"/><text x="125" y="75" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E7F1FF" >SOURCE</text><rect x="295" y="49" width="166" height="42" rx="10" fill="#19273A" stroke="#29374C"/><circle cx="312" cy="70" r="4" fill="#73E1BD" class="pulse-2"/><text x="330" y="75" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E7F1FF" >PIPELINE</text><rect x="500" y="49" width="166" height="42" rx="10" fill="#19273A" stroke="#29374C"/><circle cx="517" cy="70" r="4" fill="#73E1BD" class="pulse-2"/><text x="535" y="75" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E7F1FF" >BUILD</text><rect x="705" y="49" width="166" height="42" rx="10" fill="#19273A" stroke="#29374C"/><circle cx="722" cy="70" r="4" fill="#73E1BD" class="pulse-2"/><text x="740" y="75" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E7F1FF" >DEPLOY</text><rect x="910" y="49" width="166" height="42" rx="10" fill="#19273A" stroke="#29374C"/><circle cx="927" cy="70" r="4" fill="#73E1BD" class="pulse-2"/><text x="945" y="75" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E7F1FF" >VERIFY</text><path d="M257 70H292" stroke="#B4A1FF" stroke-width="2" class="dash"/><path d="M285 66L292 70L285 74" fill="none" stroke="#B4A1FF" stroke-width="1.6"/><path d="M462 70H497" stroke="#B4A1FF" stroke-width="2" class="dash"/><path d="M490 66L497 70L490 74" fill="none" stroke="#B4A1FF" stroke-width="1.6"/><path d="M667 70H702" stroke="#B4A1FF" stroke-width="2" class="dash"/><path d="M695 66L702 70L695 74" fill="none" stroke="#B4A1FF" stroke-width="1.6"/><path d="M872 70H907" stroke="#B4A1FF" stroke-width="2" class="dash"/><path d="M900 66L907 70L900 74" fill="none" stroke="#B4A1FF" stroke-width="1.6"/></svg>