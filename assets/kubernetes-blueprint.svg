<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Kubernetes cluster blueprint</title><desc id="desc">Five-node kubeadm cluster with three control-plane nodes, two worker nodes, external etcd and API load balancer.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10263a"/><stop offset="1" stop-color="#0a1827"/></linearGradient><style>.node{fill:#10283d;stroke:#38bdf8;stroke-width:1.5}.worker{fill:#102d2b;stroke:#34d399;stroke-width:1.5}.label{font:600 15px Arial,sans-serif;fill:#e2e8f0}.small{font:12px Arial,sans-serif;fill:#94a3b8}.line{fill:none;stroke:#38bdf8;stroke-width:2;stroke-dasharray:7 7;animation:flow 7s linear infinite}.green{fill:none;stroke:#34d399;stroke-width:2;stroke-dasharray:7 7;animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-56}}</style></defs>
<rect width="1200" height="470" rx="18" fill="#071426" stroke="#24445d"/><text x="34" y="42" class="small" letter-spacing="2">PLATFORM BLUEPRINT / KUBEADM</text><text x="34" y="76" class="label" font-size="23">5-node Kubernetes cluster</text><rect x="36" y="112" width="1128" height="315" rx="14" fill="url(#panel)" stroke="#24445d"/>
<rect x="64" y="142" width="220" height="76" rx="10" class="node"/><text x="82" y="172" class="label">API Load Balancer</text><text x="82" y="195" class="small">Kubernetes API endpoint</text><rect x="890" y="142" width="236" height="76" rx="10" class="node"/><text x="910" y="172" class="label">External etcd</text><text x="910" y="195" class="small">External cluster</text><path d="M284 180H340V242M890 180H852V242" class="line"/>
<g><rect x="330" y="242" width="164" height="72" rx="10" class="node"/><text x="350" y="271" class="label">Control plane 1</text><text x="350" y="294" class="small">kubeadm</text><rect x="518" y="242" width="164" height="72" rx="10" class="node"/><text x="538" y="271" class="label">Control plane 2</text><text x="538" y="294" class="small">kubeadm</text><rect x="706" y="242" width="164" height="72" rx="10" class="node"/><text x="726" y="271" class="label">Control plane 3</text><text x="726" y="294" class="small">kubeadm</text></g>
<path d="M412 218V242M600 218V242M788 218V242" class="line"/><path d="M412 314V348H500V366M600 314V366M788 314V348H700V366" class="green"/><rect x="420" y="366" width="164" height="46" rx="9" class="worker"/><text x="455" y="394" class="label">Worker 1</text><rect x="616" y="366" width="164" height="46" rx="9" class="worker"/><text x="651" y="394" class="label">Worker 2</text><text x="84" y="380" class="small">3 control-plane nodes</text><text x="84" y="400" class="small">2 worker nodes</text><circle cx="64" cy="452" r="4" fill="#38bdf8"/><text x="78" y="456" class="small">API / control-plane path</text><circle cx="300" cy="452" r="4" fill="#34d399"/><text x="314" y="456" class="small">Worker connectivity</text></svg>
